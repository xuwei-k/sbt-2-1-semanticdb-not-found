on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sbt:
          - 2.1.0-RC2
          - 2.1.0-RC1
          - 2.0.12
          - 1.13.1
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: zulu
    - uses: sbt/setup-sbt@v1
    - run: echo "sbt.version=${{ matrix.sbt }}" > project/build.properties
    - run: sbt
           -v
           --server
           "scalafix RemoveUnused"
